sh([1,"# Basic RAG Search with Alchemyst AI (Python SDK)\n\n## Background\nAlchemyst AI is a Context Engine that provides AI agents with persistent memory and business-specific data through built-in chunking, embedding, and retrieval. In this task you will use the official Python SDK (`alchemystai`) to ingest a small policy document into the Alchemyst context engine and then query that same context engine for an answer.\n\n## Requirements\n- Create a Python script at `/home/user/myproject/rag_search.py` that:\n  - Initializes an `AlchemystAI` client using the `ALCHEMYST_AI_API_KEY` environment variable.\n  - Ingests exactly one document via `client.v1.context.add(...)` whose `content` is the refund policy text below.\n  - Sets `context_type=\"resource\"`, `source=\"docs\"`, and `scope=\"internal\"` when adding the document.\n  - Provides `metadata` for the document including a `file_name` field that is unique per run, of the form `refund-policy-\u003crun-id\u003e.md` (see Implementation Hints).\n  - After ingesting, calls `client.v1.context.search(...)` with the query `What is the refund policy?`, `similarity_threshold=0.7`, `scope=\"internal\"`, and prints the content of the top match to stdout.\n  - Mirrors the printed top-match line into the log file `/home/user/myproject/output.log`.\n- Run the script so that it actually ingests the document into Alchemyst and writes the log file.\n- Document content (must be ingested verbatim):\n\n  ```\n  Our refund policy: We offer a 30-day money back guarantee. Contact support@example.com to request a refund.\n  ```\n\n## Implementation Hints\n- Install the Alchemyst Python SDK with `pip install alchemystai`; import it as `from alchemyst_ai import AlchemystAI`.\n- Read `run-id` from the `ZEALT_RUN_ID` environment variable and append it to the `file_name` metadata value to avoid `409 Conflict` errors across repeated runs (the Alchemyst API rejects duplicate `file_name` values).\n- Use `client.v1.context.add` to ingest the document (it accepts a list under `documents=[{...}]`).\n- Use `client.v1.context.search` to retrieve the top match; the response object exposes a `contexts` attribute (a list) where each entry has a `content` attribute.\n- After printing the top match, also write that same content into `/home/user/myproject/output.log` on a line beginning with `Top Match:`.\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Script path: /home/user/myproject/rag_search.py\n- Log file: /home/user/myproject/output.log\n- The agent MUST read `run-id` from the `ZEALT_RUN_ID` environment variable and use the value `refund-policy-${run-id}.md` as the `metadata.file_name` for the ingested document.\n- After running the script:\n  - A document with `metadata.file_name = refund-policy-${run-id}.md` MUST be retrievable from the Alchemyst context engine via `v1.context.search` for the query `What is the refund policy?` with `scope=\"internal\"` and `similarity_threshold=0.7`.\n  - The log file MUST contain a line of the format `Top Match: \u003ccontent\u003e` where `\u003ccontent\u003e` includes the exact substring `30-day money back guarantee`.\n\n"])</script><script>self.__next_f.push([1,"a:Teaa,"])</script><script>self.__next_f.push([1,"# Basic RAG Ingest and Search with Alchemyst AI (TypeScript)\n\n## Background\nYou are building the simplest possible Retrieval-Augmented Generation (RAG) flow on top of [Alchemyst AI](https://getalchemystai.com/docs/getting-started/quickstart), a managed Context Engine. Your job is to write a small Node.js/TypeScript script that uses the official `@alchemystai/sdk` package to (1) ingest a short FAQ document into the Alchemyst context store and (2) search for the answer to a question and print the matching snippet.\n\nThe script must hit the real Alchemyst API using the `ALCHEMYST_AI_API_KEY` environment variable. Do not mock the SDK.\n\n## Requirements\n- Create a Node.js/TypeScript project at `/home/user/rag_task`.\n- Use the official `@alchemystai/sdk` package (already installed in the environment).\n- Implement a script named `index.ts` that:\n  1. Reads `ZEALT_RUN_ID` from the environment and generates a UUID suffix for the document `file_name` to avoid `409 Conflict` errors on retries.\n  2. Ingests the following FAQ document into the Alchemyst context store using `client.v1.context.add`:\n     - `content`: `\"Refund policy: We offer a 30-day money back guarantee. To request a refund, email support@example.com with your order ID.\"`\n     - `metadata.file_name`: `faq-\u003crun-id\u003e-\u003cuuid\u003e.md` (must be globally unique per run/retry).\n     - `metadata.group_name`: `[\"alchemyst-harbor\", \"\u003crun-id\u003e\"]`.\n     - `context_type`: `\"resource\"`, `source`: `\"docs\"`, `scope`: `\"internal\"`.\n  3. Searches for the question `\"What is the refund policy?\"` using `client.v1.context.search` with:\n     - `similarity_threshold`: `0.5`\n     - `scope`: `\"internal\"`\n     - `metadata.groupName`: `[\"\u003crun-id\u003e\"]` (note camelCase `groupName` is required for the search endpoint in the TS SDK).\n  4. Prints output to **stdout** AND appends it to `/home/user/rag_task/output.log` in the exact format described in **Acceptance Criteria** below.\n- The script must be runnable with `npx tsx /home/user/rag_task/index.ts` from the project directory.\n\n## Implementation Hints\n- The Alchemyst TS SDK is imported as the default export: `import AlchemystAI from '@alchemystai/sdk'` and constructed with `new AlchemystAI({ apiKey: process.env.ALCHEMYST_AI_API_KEY })`.\n- Watch out for the documented parameter inconsistency: storage uses `group_name` (snake_case) inside `metadata`, while the TS search endpoint expects `groupName` (camelCase) inside `metadata`.\n- Use any UUID library available (e.g. `node:crypto`'s `randomUUID()`) to guarantee uniqueness of `file_name` per run.\n- `client.v1.context.search` returns `{ contexts: [...] }` where each context has a `content` field. Use the first context's `content` for the snippet output.\n- Read the current `run-id` from the `ZEALT_RUN_ID` environment variable and embed it in the `file_name` and `group_name` so that concurrent runs do not interfere with each other.\n\n## Acceptance Criteria\n- Project path: `/home/user/rag_task`\n- Log file: `/home/user/rag_task/output.log`\n- The script must successfully call the real Alchemyst API (no mocks).\n- The document `file_name` in the ingested metadata must follow the pattern `faq-\u003crun-id\u003e-\u003cuuid\u003e.md` and be unique per run (using a UUID suffix).\n- The document `group_name` must include `\"\u003crun-id\u003e\"` (the value of `ZEALT_RUN_ID`).\n- After execution, `/home/user/rag_task/output.log` must contain, in order, lines matching the following patterns (one item per line):\n  - `Stored file_name: \u003cfile_name\u003e` — the exact `file_name` used during ingestion.\n  - `Search matches: \u003cN\u003e` — the number of contexts returned by the search (must be `\u003e= 1`).\n  - `Top snippet: \u003ccontent\u003e` — the `content` of the top-ranked context, which must include the substring `30-day money back guarantee`.\n\n"])</script><script>self.__next_f.push([1,"b:Td26,"])</script><script>self.__next_f.push([1,"# Batch Upload FAQ Documents with Alchemyst AI (Python)\n\n## Background\nYou are migrating a small FAQ knowledge base into Alchemyst AI's Context Engine so it can later be used for RAG. To minimize round-trips and API usage, all FAQ entries must be ingested in a single batched `v1.context.add` call using the Alchemyst AI Python SDK (`alchemystai`). After ingestion, your script should confirm the documents are retrievable through `v1.context.search` and record the result.\n\n## Requirements\n- Use the Alchemyst AI Python SDK (`alchemystai`) authenticated via the `ALCHEMYST_AI_API_KEY` environment variable.\n- Define 5 distinct short FAQ entries (each ~1-3 sentences) covering different topics, for example: refunds, shipping, account creation, password reset, and contact support.\n- Upload all 5 documents in a SINGLE `client.v1.context.add(...)` call (batched).\n- Each document must include a `metadata` field with a unique `file_name`. The `file_name` MUST be unique per document and per task run: it must follow the pattern `\u003cuuid\u003e-\u003ctopic\u003e-\u003crun-id\u003e.md`, where `\u003crun-id\u003e` is read from the `ZEALT_RUN_ID` environment variable and `\u003cuuid\u003e` is a freshly generated UUID4 prefix. This prevents `409 Conflict` errors on repeat runs and isolates concurrent runs.\n- Use `context_type=\"resource\"`, `source=\"faq\"`, and `scope=\"internal\"` for the batched call.\n- After uploading, run `client.v1.context.search` once per FAQ topic (5 searches total) using a topic-specific query and `similarity_threshold=0.5`. Count how many of the 5 uploaded documents you can locate by matching their `file_name` in the returned contexts' metadata.\n- Write the resulting count to `/workspace/result.json` in the exact JSON shape `{\"retrievable\": \u003cint\u003e, \"uploaded\": 5, \"run_id\": \"\u003crun-id\u003e\", \"file_names\": [\"\u003cfile_name_1\u003e\", ..., \"\u003cfile_name_5\u003e\"]}`.\n\n## Implementation Hints\n- Initialize the SDK with `AlchemystAI(api_key=os.environ[\"ALCHEMYST_AI_API_KEY\"])`.\n- Build the documents list ahead of time and pass it in one `documents=[...]` argument so only one HTTP request is made for ingestion.\n- The `v1.context.search` response exposes a `contexts` collection; each context carries a `metadata` field where `file_name` is preserved from upload.\n- The ingestion is asynchronous on the backend; a short delay (a few seconds) between upload and search is usually enough for indexing to complete. Retry the search a small number of times if needed.\n- Remember that uploading two documents with the same `file_name` triggers `409 Conflict`. Including the `ZEALT_RUN_ID` and a UUID in each `file_name` keeps the task safe to run concurrently and re-runnable.\n\n## Acceptance Criteria\n- Project path: /workspace\n- Result file: /workspace/result.json\n- The result file must be valid JSON with the following shape:\n\n  ```json\n  {\n    \"retrievable\": 5,\n    \"uploaded\": 5,\n    \"run_id\": \"\u003crun-id\u003e\",\n    \"file_names\": [\"\u003cfile_name_1\u003e\", \"\u003cfile_name_2\u003e\", \"\u003cfile_name_3\u003e\", \"\u003cfile_name_4\u003e\", \"\u003cfile_name_5\u003e\"]\n  }\n  ```\n\n- `retrievable` must equal `5` and `uploaded` must equal `5`.\n- `run_id` must equal the value of the `ZEALT_RUN_ID` environment variable.\n- `file_names` must be an array of 5 unique strings, each containing the `ZEALT_RUN_ID` value as a substring.\n- All 5 documents listed in `file_names` must be retrievable from Alchemyst AI via `v1.context.search` using their own topic as the query.\n\n"])</script><script>self.__next_f.push([1,"c:Te21,"])</script><script>self.__next_f.push([1,"# Context-Aware CLI Chatbot with Alchemyst AI Memory (Python)\n\n## Background\nBuild a non-interactive command-line chatbot in Python that uses Alchemyst AI as its context/memory layer and OpenAI as its language model. The CLI should be safely re-runnable: each time it is invoked it must search the Alchemyst context engine for prior conversation snippets scoped to the current run, feed them as system context to an OpenAI chat completion, print the assistant reply on stdout, and then persist the new user/assistant turn back into the Alchemyst context engine so future invocations can recall it.\n\nThis pattern is inspired by the Alchemyst CLI chatbot example but extends it with cross-invocation memory: because each invocation is a fresh process, the only way to remember earlier turns is to store them in Alchemyst keyed by a stable `userId`/`sessionId` and read them back on the next call.\n\n## Requirements\n- Implement a Python 3.11+ CLI named `chat.py` that takes the user message as a single positional argument:\n  `python chat.py \"\u003cquestion\u003e\"`.\n- The CLI must read the current `run-id` from the `ZEALT_RUN_ID` environment variable and derive a deterministic `userId` and `sessionId` from it (so concurrent runs do not collide).\n- On every invocation the CLI must:\n  1. Search the Alchemyst context engine for snippets relevant to the current message, scoped to this run's `userId`/`sessionId`.\n  2. Build an OpenAI chat completion request using the retrieved snippets as system context together with the new user message.\n  3. Print only the assistant's reply text on stdout (no extra prefixes/banners on the line containing the answer).\n  4. Store the new turn (the user message and the assistant reply) back into Alchemyst under the same `userId`/`sessionId` so it can be retrieved on subsequent invocations.\n- Two consecutive invocations within the same `ZEALT_RUN_ID` must share state: a fact stated in the first call must be recallable in the second call's answer.\n- Read `ALCHEMYST_AI_API_KEY` and `OPENAI_API_KEY` from environment variables. Do not hardcode credentials.\n\n## Implementation Hints\n- Use the `alchemystai` Python SDK to talk to the Alchemyst context engine and the `openai` Python SDK for chat completions.\n- Memory in Alchemyst is keyed by `userId` and `sessionId`; both are required. Derive stable values from `ZEALT_RUN_ID` such as `cli-user-${ZEALT_RUN_ID}` and `cli-session-${ZEALT_RUN_ID}`.\n- After retrieving snippets, format them into a system message so the LLM has the prior facts available before answering the new question.\n- Keep stdout clean so a calling shell can capture the reply with `$(python chat.py \"...\")` or by redirection.\n- Choose an OpenAI chat model that is generally available (e.g., `gpt-4o-mini`).\n\n## Acceptance Criteria\n- Project path: /home/user/cli-chatbot\n- Entry script: /home/user/cli-chatbot/chat.py\n- Command: `python chat.py \"\u003cquestion\u003e\"` (the question is a single positional argument)\n- The script exits with status 0 on success and prints the assistant reply to stdout.\n- Memory scoping: the `userId` and `sessionId` used by the script must be derived from the `ZEALT_RUN_ID` environment variable so two invocations in the same run share memory and two invocations in different runs do not.\n- Cross-invocation recall: when invoked twice in sequence within the same `ZEALT_RUN_ID`, where the first invocation states a fact and the second asks about that fact, the second invocation's stdout must include the fact previously stated.\n- The script must call the real Alchemyst AI API and the real OpenAI API; mocking either provider is not allowed.\n\n"])</script><script>self.__next_f.push([1,"d:T109e,"])</script><script>self.__next_f.push([1,"# Context Arithmetic: Group Intersection with the Alchemyst AI Python SDK\n\n## Background\n[Alchemyst AI](https://getalchemystai.com/) is a Context Engine that uses *Context Arithmetic* — a set-algebra mental model — to retrieve documents at query time. When you ingest documents tagged with multiple values in the `group_name` metadata list, Alchemyst treats each value as a set membership. A search filtered by a list of `group_name` values returns only documents that belong to **all** of those groups (intersection / AND semantics).\n\nIn this task you will use the official Python SDK (`alchemystai` package, imported as `alchemyst_ai`) to demonstrate this intersection behavior end-to-end against the real Alchemyst Cloud API.\n\n## Requirements\n- Write a Python 3.11 script that, in a single execution:\n  1. Reads the `ZEALT_RUN_ID` environment variable and uses it (together with random UUID suffixes) to build collision-free `file_name` values so the script can be re-run safely.\n  2. Ingests **three** distinct documents via `client.v1.context.add(...)`, each tagged with a different `group_name` list:\n     - Document A — groups `[\"eng\", \"v1\"]`, content mentions the marker string `MARKER_ENG_V1_\u003crun-id\u003e`.\n     - Document B — groups `[\"eng\", \"v2\"]`, content mentions the marker string `MARKER_ENG_V2_\u003crun-id\u003e`.\n     - Document C — groups `[\"docs\", \"v1\"]`, content mentions the marker string `MARKER_DOCS_V1_\u003crun-id\u003e`.\n     Each document's content should be a short paragraph that is *semantically related* (e.g. about an internal service or product), so that a single semantic search query can match all three before group filtering is applied.\n  3. Performs **one** search via `client.v1.context.search(...)` using the query text supplied below, with the metadata filter `group_name=[\"eng\", \"v1\"]` (intersection of the `eng` and `v1` sets).\n  4. Writes the resulting contexts to `/workspace/result.json` using the schema described under *Acceptance Criteria*.\n- The script must use the real Alchemyst Cloud API (no mocking). The `ALCHEMYST_AI_API_KEY` environment variable will be available in the container.\n\n## Implementation Hints\n- Install and import the SDK: `pip install alchemystai`, then `from alchemyst_ai import AlchemystAI`.\n- Construct the client with `AlchemystAI(api_key=os.environ[\"ALCHEMYST_AI_API_KEY\"])`.\n- For each `add` call, set `context_type=\"resource\"`, `scope=\"internal\"`, a meaningful `source` string, and pass a `metadata` dict that includes both `file_name` (unique per run) and `group_name` (list of strings). The Python SDK uses snake_case `group_name` consistently for both storage and search.\n- For the search call, pass `metadata={\"group_name\": [\"eng\", \"v1\"]}` and use `scope=\"internal\"` together with a low-to-moderate `similarity_threshold` (e.g. `0.5`) so that the intersection document is reliably returned. The Alchemyst engine performs intersection across the supplied `group_name` values, so only documents tagged with both `eng` and `v1` should come back.\n- `client.v1.context.search(...)` returns a Pydantic response object; convert it via `.model_dump()` / `.to_dict()` or iterate `result.contexts` to extract `id` and `content` fields.\n- Make sure to flush/close the file after writing JSON, and exit with a non-zero status if any API call fails.\n\n## Acceptance Criteria\n- Project path: `/workspace`\n- Script entrypoint: `python3 /workspace/run_intersection.py`\n- Output file: `/workspace/result.json` containing a single JSON object with the following shape:\n  ```json\n  {\n    \"query\": \"\u003cthe query string used for the search\u003e\",\n    \"intersection_filter\": [\"eng\", \"v1\"],\n    \"run_id\": \"\u003cvalue of ZEALT_RUN_ID\u003e\",\n    \"results\": [\n      { \"id\": \"\u003ccontext id\u003e\", \"content\": \"\u003cchunk content excerpt\u003e\" }\n    ]\n  }\n  ```\n- The `results` array must be non-empty and must only contain chunks whose `content` includes the `MARKER_ENG_V1_\u003crun-id\u003e` marker. It must **not** include any chunk whose content contains `MARKER_ENG_V2_\u003crun-id\u003e` or `MARKER_DOCS_V1_\u003crun-id\u003e`.\n- The query used for the search must be the string `What does the v1 engineering service do?`.\n- All `file_name` metadata values created by the run must include the `ZEALT_RUN_ID` value as a substring so concurrent runs do not collide.\n\n"])</script><script>self.__next_f.push([1,"e:Tc5c,"])</script><script>self.__next_f.push([1,"# Delete a User's Memory and Verify Removal (Alchemyst AI, Python SDK)\n\n## Background\nAlchemyst AI is a context engine that provides AI agents with persistent memory across sessions. The `alchemystai` Python SDK exposes a `v1.context.memory` resource (with `add`, `update`, and `delete` methods) and a `v1.context.search` method that searches stored context (including memory) for relevant chunks.\n\nThis task exercises the *memory deletion lifecycle*: you will store a piece of memory for a single user/session, delete it through the documented Python SDK delete API, and then verify by searching that nothing referencing the memory remains.\n\n## Requirements\n- Use the official `alchemystai` Python package and the real Alchemyst AI Platform API.\n- Read the credential `ALCHEMYST_AI_API_KEY` from the environment.\n- Read the `run-id` from the `ZEALT_RUN_ID` environment variable so the task is safe to run concurrently.\n- Use UUIDs scoped by `run-id` for both `userId` and `sessionId` so each run is isolated.\n- The memory entry to insert MUST contain the text `User's nickname is Bumble`.\n- After insertion, delete the memory through `v1.context.memory.delete` (the documented delete method on the Python SDK's memory resource).\n- After deletion, search the Alchemyst context for the query `Bumble` (scoped to the same `userId`) and write the JSON result to `/workspace/post_delete_search.json`.\n- The JSON file must demonstrate that no surviving result mentions `Bumble`.\n- Log the user id, session id, and a final status line to a log file.\n\n## Implementation Hints\n- Install/import the Python SDK as `alchemyst_ai` (PyPI name: `alchemystai`).\n- Construct the client with `AlchemystAI(api_key=os.environ[\"ALCHEMYST_AI_API_KEY\"])`.\n- The memory resource lives at `client.v1.context.memory`; the delete method's parameter names are documented in the SDK's `api.md` / source — read the docstring or signature if you are unsure which keyword arguments to pass.\n- Use `client.v1.context.search(...)` to verify post-deletion state; pass the same `user_id` you used when adding the memory and provide the required `query`, `similarity_threshold`, and `minimum_similarity_threshold` parameters.\n- Serialize the search result with the SDK response's `.to_dict()` / `model_dump()` (or `json.loads(json.dumps(..., default=str))`) before writing JSON.\n- Allow a brief wait (a few seconds) between writes and reads — the platform indexes asynchronously.\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Log file: /home/user/myproject/output.log\n- Output artifact: /workspace/post_delete_search.json\n- The `run-id` value (from `ZEALT_RUN_ID`) MUST be embedded in both the `userId` and `sessionId` so concurrent runs do not collide.\n- The log file MUST contain lines in the following formats (one occurrence each):\n  - `UserId: \u003cuserId\u003e`\n  - `SessionId: \u003csessionId\u003e`\n  - `Status: success`\n- After execution:\n  - `/workspace/post_delete_search.json` MUST exist and contain valid JSON.\n  - When the JSON is serialized as a string, it MUST NOT contain the substring `Bumble` (case-insensitive) — i.e., no surviving search result mentions the deleted memory.\n\n"])</script><script>self.__next_f.push([1,"f:Tc6a,"])</script><script>self.__next_f.push([1,"# Update an Existing Document in the Alchemyst AI Context Engine\n\n## Background\nAlchemyst AI is a context engine that stores documents and makes them retrievable via semantic search. When the *same* `file_name` is added again, the API returns a `409 Conflict` because Alchemyst uses `metadata.file_name` as a deduplication key.\n\nAn organization has already ingested an outdated policy document with `metadata.file_name = \"policy_v1.md\"`. The policy needs to be revised, but the file name must stay the same so downstream consumers keep working. You must implement the \"delete-then-add\" update pattern using the Alchemyst AI Python SDK.\n\n## Requirements\n- Write a Python script that, when executed, updates the existing policy document stored in Alchemyst AI.\n- Remove the old version of the document using the Alchemyst context-delete API.\n- Ingest the new version of the document using `v1.context.add` with `metadata.file_name = \"policy_v1.md\"` (the file name must NOT change).\n- The new document content must replace the old one. After your script runs, a semantic search for the policy must surface the **new** content, and the **old** content must no longer be retrievable.\n- The script must run end-to-end without raising an exception (including no `409 Conflict`).\n- Log the outcome to a log file so the verifier can confirm execution.\n\n## Implementation Hints\n- Read `ZEALT_RUN_ID` from the environment. The pre-existing document was ingested with `source = \"policy-docs-${ZEALT_RUN_ID}\"`. Reuse that exact `source` value for both delete and add so the update is scoped correctly and parallel runs do not collide.\n- Read `ALCHEMYST_AI_API_KEY` from the environment and use the `alchemystai` (`alchemyst_ai`) Python package to talk to Alchemyst.\n- The new policy content to ingest is:\n  \u003e `Refund Policy v2: We now offer a 90-day money-back guarantee for all customers worldwide. Contact refunds@example.com to request a refund.`\n- Keep `context_type = \"resource\"` and `scope = \"internal\"` for the add call, matching the initial ingestion.\n- The Alchemyst delete endpoint operates per `source`. Refer to the Alchemyst API reference for the exact parameter names accepted by the Python SDK's `v1.context.delete` method.\n- After deleting, give the backend a brief moment before re-adding to avoid race conditions.\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Log file: /home/user/myproject/output.log\n- Use the Alchemyst AI Python SDK (`alchemyst_ai` package) and the `ALCHEMYST_AI_API_KEY` environment variable.\n- The script must read `ZEALT_RUN_ID` from the environment and use `source = \"policy-docs-${ZEALT_RUN_ID}\"` for both the delete and the add operation.\n- The new document must be added with `metadata.file_name = \"policy_v1.md\"` (same file name as the original).\n- After the script runs, the log file must contain a line in the exact format `Update status: success`.\n- After the script runs, calling `v1.context.search` with a relevant query about the refund policy must return at least one context whose content contains the phrase `90-day` (the new content), and no returned context content may contain the phrase `7-day` (the old content).\n\n"])</script><script>self.__next_f.push([1,"10:T107c,"])</script><script>self.__next_f.push([1,"# List Per-User Memory Items with Alchemyst AI (Python)\n\n## Background\nAlchemyst AI is a Context Engine that stores conversational memories keyed by `user_id` and `session_id`. A common operational need is to enumerate the memory items that belong to a single end user, even when those memories were written across multiple sessions. In this task you will write a small Python program that seeds three distinct memory items for one user across two sessions and then queries the memory API to list every memory item that was stored for that user. The recovered list must be persisted as JSON for downstream auditing.\n\n## Requirements\n- Implement a Python script `run.py` that uses the official `alchemystai` Python SDK.\n- The script must:\n  - Read `ALCHEMYST_AI_API_KEY` and `ZEALT_RUN_ID` from the environment.\n  - Generate one `user_id` and two distinct `session_id` values, embedding both `ZEALT_RUN_ID` and a `uuid` component so that concurrent runs do not collide.\n  - Store **exactly three** distinct memory items for that `user_id` using `client.v1.context.memory.add(...)`:\n    - Two memories in the first session whose content includes the marker strings `MEM_ONE` and `MEM_TWO` respectively.\n    - One memory in the second session whose content includes the marker string `MEM_THREE`.\n  - Retrieve every memory item for that `user_id` via a broad call to the memory search API (`client.v1.context.memory.search(...)`) using both sessions. You may need a bounded retry loop because indexing is not always instantaneous.\n  - Build a JSON object describing the result and write it to `/workspace/memory_list.json` as UTF-8 with the following shape:\n    - `user_id` (string): the generated user id (must contain `ZEALT_RUN_ID`).\n    - `session_ids` (array of strings, length 2): the two session ids actually used.\n    - `count` (integer): the number of distinct memory items recovered for the user (must be \u003e= 3).\n    - `contents` (array of strings): the textual content of every recovered memory item. The combined text must contain each of the markers `MEM_ONE`, `MEM_TWO`, and `MEM_THREE` at least once.\n  - Append a single line `Memory list OK: count=\u003ccount\u003e user_id=\u003cuser_id\u003e` to `/workspace/output.log` after `memory_list.json` is written.\n- The script must call the live Alchemyst AI API. Do not mock the SDK.\n\n## Implementation Hints\n- Install the SDK with `pip install alchemystai` and import it as `from alchemyst_ai import AlchemystAI`.\n- Instantiate the client with `AlchemystAI(api_key=os.environ[\"ALCHEMYST_AI_API_KEY\"])`.\n- Memory writes go through `client.v1.context.memory.add({\"user_id\": ..., \"session_id\": ..., \"content\": ...})`.\n- Listing is performed via `client.v1.context.memory.search(user_id=..., session_id=...)`; iterate the `memories` attribute and read each item's `content`. Because memories are scoped per session, you will likely need to search each session id and merge the results to enumerate every entry for the user.\n- Use `uuid.uuid4().hex` together with `ZEALT_RUN_ID` to build unique `user_id` and `session_id` values so parallel evaluations do not collide.\n- Use `json.dump` (or `json.dumps`) to serialize the result, and remember to set `ensure_ascii=False` is optional but the file must be valid JSON.\n\n## Acceptance Criteria\n- Project path: /workspace\n- Run command: `python3 /workspace/run.py`\n- Output JSON file: /workspace/memory_list.json\n- Log file: /workspace/output.log\n- After the run command exits with code 0:\n  - `/workspace/memory_list.json` exists and parses as a JSON object with keys `user_id`, `session_ids`, `count`, and `contents`.\n  - `user_id` is a string containing the value of `ZEALT_RUN_ID`.\n  - `session_ids` is a list of exactly two distinct strings.\n  - `count` is an integer \u003e= 3 and matches `len(contents)`.\n  - The concatenation of every string in `contents` contains each of the substrings `MEM_ONE`, `MEM_TWO`, and `MEM_THREE`.\n  - `/workspace/output.log` contains a line matching `Memory list OK: count=\u003ccount\u003e user_id=\u003cuser_id\u003e e the official quickstart pattern: `new AlchemystAI({ apiKey })` then `client.v1.context.add({ documents, context_type: 'resource', source: 'docs', scope: 'internal' })` for ingestion and `client.v1.context.search({ query, similarity_threshold, scope: 'internal', metadata: { groupName: [...] } })` for retrieval.\n- The search filter MUST be `groupName` (camelCase) — this is the inconsistency this task is designed to exercise.\n- Use a `similarity_threshold` low enough (e.g. 0.3-0.5) to ensure the three alpha documents are retrievable.\n- After search returns, inspect each context's `metadata.group_name` array, flatten and de-duplicate them, then sort lexicographically before writing the JSON.\n- Ingestion is asynchronous server-side; consider giving the index a short wait (e.g. ~10 seconds) before searching so the documents are indexed.\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Log file: /workspace/group_result.json\n- The script is executable end-to-end from the project directory using `npm` and Node.js 20+.\n- The script reads `ALCHEMYST_AI_API_KEY` and `ZEALT_RUN_ID` from the environment.\n- `/workspace/group_result.json` MUST exist after the script completes and MUST be a JSON object with exactly these top-level keys and types:\n  ```json\n  {\n    \"count\": number,\n    \"groups\": string[]\n  }\n  ```\n  - `count` is the number of context items returned by the single search call.\n  - `groups` is the sorted, de-duplicated list of group names extracted from `metadata.group_name` across all returned contexts.\n- All returned context items MUST be tagged exclusively with the alpha group for the current `ZEALT_RUN_ID` (i.e. no beta-group contexts leak into the result).\n\n"])</script><script>self.__next_f.push([1,"12:Tbc5,"])</script><script>self.__next_f.push([1,"# Cross-Session Memory Recall with Alchemyst AI (Python)\n\n## Background\nAlchemyst AI is a Context Engine that provides AI agents with persistent, cross-session user memory. M cial `@alchemystai/sdk` npm package.\n- Read the API key from the `ALCHEMYST_AI_API_KEY` environment variable (the package picks it up automatically when set; you may also pass it explicitly to the client constructor).\n- Generate fresh, unique IDs with `crypto.randomUUID()` (from Node's built-in `node:crypto`). To keep parallel runs isolated, read the `ZEALT_RUN_ID` environment variable and combine it with the random UUIDs (for example `zealt-${ZEALT_RUN_ID}-\u003cuuid\u003e`).\n- Add the memory entry in session A using `client.v1.context.memory.add` with a `sessionId` and a `contents` array; the stored text MUST include the literal word `Rust` (case-sensitive) and convey that it is the user's preferred coding language.\n- After adding, wait long enough for the platform to index the memory (a few seconds is sufficient) before searching.\n- From session B, search for the preference using `client.v1.context.search` with a natural-language query about the user's preferred coding language. Use `scope: \"internal\"` and reasonable similarity thresholds (e.g. `similarity_threshold: 0.8`, `minimum_similarity_threshold: 0.5`). If no results come back, retry the search a few times with a short delay before giving up.\n- Write the recall result to `/workspace/recall.json` as a JSON object with at least these top-level fields:\n  - `userId`: the synthetic user id used for the run.\n  - `sessionA`: the session id used to store the memory.\n  - `sessionB`: the session id used to perform the recall.\n  - `query`: the natural-language query string sent to `context.search`.\n  - `contexts`: the array returned by the SDK (use the SDK's `contexts` field as-is; each entry should preserve its `content` and any score/timestamp fields).\n- The final state of `/workspace/recall.json` MUST contain at least one entry in `contexts` whose `content` field mentions `Rust`.\n\n## Implementation Hints\n- Install the SDK with `npm install @alchemystai/sdk` and write your program in TypeScript; yo e Alchemyst AI Python SDK\n\n## Background\nAlchemyst AI is a Context Engine that ingests documents and retrieves relevant chunks based on semantic similarity. The `v1.context.search` API accepts a `similarity_threshold` parameter (typically between 0.0 and 1.0) that controls how strict the retrieval is: low values increase recall (return more, possibly loosely related chunks), while high values increase precision (return only very strong matches).\n\nIn this task, you will use the Python SDK `alchemystai` to ingest a small corpus that contains both directly relevant and loosely related documents about a specific topic. You will then issue two searches against the same query with different `similarity_threshold` values (`0.5` and `0.9`) and persist the count of returned context chunks for each search to a JSON report file.\n\n## Requirements\n- Use the official Python SDK package `alchemystai` (import path: `alchemyst_ai`).\n- Read the API key from the `ALCHEMYST_AI_API_KEY` environment variable.\n- Read the current run identifier from the `ZEALT_RUN_ID` environment variable. Use it to make every ingested document's `file_name` metadata unique per run (e.g. `\u003cbase-name\u003e-${ZEALT_RUN_ID}.md`) so the task is safe to run concurrently and is retryable against the shared Alchemyst tenant.\n- Ingest at least five documents into the Alchemyst context engine using `client.v1.context.add`:\n  - At least two documents whose content is directly about the query topic (the company's refund / money-back policy).\n  - At least three documents whose content is on loosely related topics (e.g. shipping, privacy, returns of damaged items, general customer support).\n  - Each ingested document MUST set `metadata.file_name` to a unique value that includes the run id.\n  - Use `context_type=\"resource\"`, `source=\"docs\"`, and `scope=\"internal\"` for ingestion.\n- After ingestion, perform two searches with `client.v1.context.search` using the SAME query string `\"What is the refund policy?\"` and `scope=\"internal\"`:\n  - First search: `similarity_threshold=0.5`.\n  - Second search: `similarity_threshold=0.9`.\n- Write the result counts to `/workspace/threshold_report.json` with the exact schema described in the Acceptance Criteria.\n\n## Implementation Hints\n- Instantiate the client with `AlchemystAI(api_key=os.environ[\"ALCHEMYST_AI_API_KEY\"])`.\n- The search response object exposes a `contexts` list; count its length for each threshold.\n- Because Alchemyst rejects duplicate `file_name`s with HTTP 409, derive file names from the run id to keep them unique on every run.\n- After ingestion, you may need to give the index a brief moment before searching.\n- Ensure the script exits with a non-zero status if any API call fails so problems are surfaced clearly.\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Output file: /workspace/threshold_report.json\n- The output file MUST be valid JSON with exactly the following top-level shape:\n\n  ```json\n  {\n    \"query\": \"What is the refund policy?\",\n    \"threshold_0_5_count\": \u003cnon-negative integer\u003e,\n    \"threshold_0_9_count\": \u003cnon-negative integer\u003e,\n    \"run_id\": \"\u003cvalue of ZEALT_RUN_ID\u003e\"\n  }\n  ```\n\n- `threshold_0_5_count` and `threshold_0_9_count` MUST both be non-negative integers reflecting the actual number of chunks returned by the two real Alchemyst searches (no mocking).\n- The relationship `threshold_0_5_count \u003e= threshold_0_9_count` MUST hold, demonstrating that lowering `similarity_threshold` does not reduce recall.\n- `run_id` in the report MUST match the value of the `ZEALT_RUN_ID` environment variable at run time.\n\n"])</script><script>self.__next_f.push([1,"18:T1753,"])</script><script>self.__next_f.push([1,"# Multi-Day Customer Support Ticket with Alchemyst AI Memory (TypeScript)\n\n## Background\n[Alchemyst AI](https://getalchemystai.com/) is a Context Engine that gives AI agents persistent memory across sessions. Real-world customer support tickets often span several days: a customer reports an issue on day 1, the support team adds investigation notes on day 2, and on day 3 the customer asks for an update. The agent that handles day 3 must reconstruct everything that has happened so far from durable memory, not from in-process state.\n\nIn this task you will build a small Node.js (TypeScript) program that simulates this multi-day flow against the **real** Alchemyst platform. The program runs all three \"days\" in a single invocation (no need to actually sleep between days), uses `@alchemystai/sdk` to persist and retrieve memories, and uses the Vercel AI SDK (`ai` + `@ai-sdk/openai`) with OpenAI to produce a final status summary that demonstrates the agent has access to the full ticket history.\n\n## Requirements\n- Use Node.js 20+, the official `@alchemystai/sdk` package, the Vercel AI SDK `ai` package, and `@ai-sdk/openai`.\n- Read credentials from environment variables:\n  - `ALCHEMYST_AI_API_KEY` for the Alchemyst client.\n  - `OPENAI_API_KEY` for the Vercel AI SDK OpenAI provider.\n- Read the `ZEALT_RUN_ID` environment variable and build run-isolated identifiers so that parallel runs cannot collide. In particular:\n  - The synthetic customer `userId` MUST contain the value of `ZEALT_RUN_ID` as a substring.\n  - The support ticket `sessionId` MUST contain the value of `ZEALT_RUN_ID` as a substring **and** MUST start with the literal prefix `ticket-` (e.g. `ticket-${ZEALT_RUN_ID}-\u003crandom\u003e`).\n  - The same `userId`/`sessionId` pair MUST be used for all three days in the same run.\n- Persist the following memory entries via `client.v1.context.memory.add`, both bound to the same `userId` and the same `sessionId`:\n  - **Day 1 (customer message)**: the stored text MUST include the literal substring `order #12345` and convey that the customer is reporting that the order has not arrived.\n  - **Day 2 (support agent update)**: the stored text MUST include the literal substring `shipping carrier delay` and convey that the support team is investigating the issue.\n- On **Day 3**, the program MUST:\n  1. Search Alchemyst memory using `client.v1.context.memory.search` (or `client.v1.context.search`) scoped to the same `userId` and `sessionId` to recover the day-1 and day-2 entries. Retry a few times with a short delay if the platform has not finished indexing yet.\n  2. Call an OpenAI chat model through the Vercel AI SDK (e.g. `generateText({ model: openai('gpt-4o-mini'), ... })`) and pass the retrieved memory entries to the model as conversational context. The user prompt on day 3 is: `What is the status of my order?`.\n  3. Write the model's natural-language reply to `/workspace/summary.txt` exactly as returned by the model (UTF-8, no JSON wrapping). The summary MUST contain both the substring `12345` and the substring `shipping carrier` (case-sensitive) so the verifier can confirm the model actually used the recalled context. Do not hard-code those strings into the file; they must come from the LLM output.\n- Also write a structured trace of the run to `/workspace/run.log` as JSON with at least the following fields: `runId`, `userId`, `sessionId`, `day1Stored`, `day2Stored`, `memoriesFound` (the number of memory entries returned by the day-3 search), and `summaryPath`.\n- Use a sensible exit code: `0` on success, non-zero on any failure (missing env vars, API errors after retries, model output that does not mention both required substrings, etc.).\n\n## Implementation Hints\n- Install dependencies with `npm install @alchemystai/sdk ai @ai-sdk/openai` and run TypeScript via `tsx`, `ts-node`, or by compiling with `tsc` and executing the output with `node`.\n- The Alchemyst client is constructed as `new AlchemystAI({ apiKey: process.env.ALCHEMYST_AI_API_KEY })` (default import from `@alchemystai/sdk`). The memory API lives under `client.v1.context.memory`.\n- Memory add accepts `{ sessionId, contents: [{ content: \"...\" }] }`. You may embed the `userId` inside the stored `content` so semantic search can find it, but you MUST also pass it as the structured `userId` field if the SDK exposes one.\n- For the day-3 LLM call, use the Vercel AI SDK pattern documented by Alchemyst: import `generateText` from `ai`, import `openai` from `@ai-sdk/openai`, and pass the recalled memories as part of the prompt or message history. You do **not** have to use `withAlchemyst` / `alchemystTools` for this task; manually retrieving memory and feeding it into `generateText` is acceptable and easier to control.\n- Indexing is not instantaneous; consider polling the memory search a few times before giving up.\n- Keep the LLM temperature low so the response stays grounded in the retrieved context.\n- Use `fs/promises` (or `node:fs/promises`) to write `/workspace/summary.txt` and `/workspace/run.log`.\n\n## Acceptance Criteria\n- Project path: `/workspace`\n- Output files:\n  - `/workspace/summary.txt` - the day-3 LLM reply. UTF-8 plain text. MUST contain both `12345` and `shipping carrier` (case-sensitive) as substrings.\n  - `/workspace/run.log` - JSON object containing at least the fields `runId`, `userId`, `sessionId`, `day1Stored`, `day2Stored`, `memoriesFound`, and `summaryPath`. `userId` and `sessionId` MUST contain the value of `ZEALT_RUN_ID`, and `sessionId` MUST start with `ticket-`.\n- The script must successfully complete the day-1 add, day-2 add, day-3 search, and day-3 LLM summarization against the real Alchemyst AI API and the real OpenAI API (no mocking).\n- Verification will independently query the Alchemyst platform with the `sessionId` written to `run.log` and expect to find at least one stored memory whose content mentions `order #12345` and at least one stored memory whose content mentions `shipping carrier delay`.\n\n"])</script><script>self.__next_f.push([1,"19:T120f,"])</script><script>self.__next_f.push([1,"# SyllabAI-Style Syllabus Q\u0026A with Alchemyst AI (Python SDK)\n\n## Background\nYou are building a script inspired by [SyllabAI](https://getalchemystai.com/docs/example-projects/team/syllabai) that turns a course syllabus into an interactive study assistant. Using the Alchemyst AI Python SDK (`alchemystai`), you will ingest several excerpts from a Math 101 syllabus as separate documents into the Alchemyst context engine, then issue three different questions **in parallel** to retrieve the most relevant snippet for each question. The top retrieved snippet per question must be written to a structured JSON answer file.\n\n## Requirements\n- Use the Alchemyst AI Python SDK (`alchemystai`) authenticated via the `ALCHEMYST_AI_API_KEY` environment variable.\n- Read the `ZEALT_RUN_ID` environment variable and use it to isolate this trial's documents from concurrent runs. Append `${ZEALT_RUN_ID}` as a third element of the `group_name` array so that ingestion and searches stay scoped to this run.\n- Ingest **5 separate syllabus excerpt documents** (one document per `client.v1.context.add` document entry) covering at least: the **midterm exam date**, the **required textbook**, the **grading policy**, the **office hours**, and the **course description**. Each document must include a metadata dict with:\n    - A **unique `file_name`** generated with `uuid.uuid4()` (e.g., `syllabus-\u003cuuid4\u003e.md`).\n    - `group_name = [\"syllabus\", \"math101\", \"${ZEALT_RUN_ID}\"]` (the literal strings `syllabus` and `math101`, plus the run-id read from the environment).\n- Issue the following three questions **in parallel** (e.g., with a thread pool or `asyncio`) against the Alchemyst context engine, filtered to the run-scoped group via `metadata={\"group_name\": [..., \"${ZEALT_RUN_ID}\"]}`:\n    1. `When is the midterm?`\n    2. `What textbook is required?`\n    3. `What is the grading policy?`\n- For each question, take the **top (highest-ranked) snippet** returned by `client.v1.context.search` and record it.\n- Write the structured answers to `/workspace/syllabus_answers.json` using the schema described in Acceptance Criteria.\n\n## Implementation Hints\n- Initialize the SDK with `AlchemystAI(api_key=os.environ[\"ALCHEMYST_AI_API_KEY\"])`.\n- Use `client.v1.context.add(...)` with `context_type=\"resource\"`, `source=\"syllabus\"`, `scope=\"internal\"` to ingest the excerpts. All 5 documents may be sent in a single `add` call (one entry per document) or one at a time — what matters is that they each carry distinct content and a unique `file_name`.\n- After ingestion, allow a short delay (a few seconds) for indexing before searching.\n- For the parallel search step, you can use `concurrent.futures.ThreadPoolExecutor` and submit one `client.v1.context.search(...)` call per question, or use `asyncio.to_thread` + `asyncio.gather`.\n- Use `similarity_threshold=0.5` (or lower) to ensure each question retrieves at least one snippet. Always pass the run-scoped `group_name` filter.\n- The Python SDK returns search results where each context has a `.content` attribute (or `content` key). Pick the first (top) item from `result.contexts`.\n- The output JSON file path is `/workspace/syllabus_answers.json`. Make sure `/workspace` exists.\n\n## Acceptance Criteria\n- Project path: /workspace\n- Output file: /workspace/syllabus_answers.json\n- The script must be invoked exactly via: `python3 /workspace/syllabus_qa.py`\n- Read `ZEALT_RUN_ID` from the environment and use it inside `group_name` for both ingestion and search.\n- 5 documents are added to the Alchemyst context engine within the group `[\"syllabus\", \"math101\", \"${ZEALT_RUN_ID}\"]`, each with a unique `file_name` metadata value.\n- `/workspace/syllabus_answers.json` exists after the run, is valid JSON, and matches this schema:\n\n    ```json\n    {\n      \"run_id\": \"\u003cvalue of ZEALT_RUN_ID\u003e\",\n      \"answers\": [\n        {\"question\": \"When is the midterm?\", \"snippet\": \"\u003ctop retrieved snippet text\u003e\"},\n        {\"question\": \"What textbook is required?\", \"snippet\": \"\u003ctop retrieved snippet text\u003e\"},\n        {\"question\": \"What is the grading policy?\", \"snippet\": \"\u003ctop retrieved snippet text\u003e\"}\n      ]\n    }\n    ```\n\n- The `answers` list must contain exactly the three questions above, in any order. Each snippet must be a non-empty string drawn from the documents you ingested.\n- The snippet for `When is the midterm?` must contain the substring `October 15` (case-insensitive).\n- The snippet for `What textbook is required?` must contain the substring `Stewart` (case-insensitive).\n- The snippet for `What is the grading policy?` must contain the substring `Homework 30%` (case-insensitive).\n\n"])</script><script>self.__next_f.push([1,"1a:T10a7,"])</script><script>self.__next_f.push([1,"# Cross-Session Memory with Vercel AI SDK + Alchemyst Middleware (TypeScript)\n\n## Background\nAlchemyst AI provides a `withAlchemyst` middleware for the Vercel AI SDK that transparently wires automatic cross-session memory into calls such as `generateText`. By calling the wrapped function with `userId` and `sessionId`, the middleware retrieves prior memories for that user, augments the LLM prompt, and stores new exchanges so future sessions can recall them.\n\nIn this task you will build a small Node.js/TypeScript program that uses `withAlchemyst` together with `generateText` from the `ai` package to demonstrate cross-session memory: a fact is stated by the user in one session, and a different session (different `sessionId`, same `userId`) is then able to recall that fact.\n\n## Requirements\n- Project must be written in TypeScript and runnable on Node.js 20+.\n- Wrap the Vercel AI SDK `generateText` function with `withAlchemyst` from the `@alchemystai/aisdk` package, using `process.env.ALCHEMYST_AI_API_KEY` for authentication.\n- Use an OpenAI chat model via the Vercel AI SDK (`@ai-sdk/openai`); authenticate with `process.env.OPENAI_API_KEY`.\n- Read the `run-id` from the `ZEALT_RUN_ID` environment variable and use it to scope user/session identifiers so concurrent runs do not collide.\n- The program must perform two calls to the wrapped `generateText`:\n  1. **Session A (write)**: With `userId = harbor-user-${run-id}` and `sessionId = session-a-${run-id}`, send a prompt that tells the assistant the user's favorite web framework is **Svelte** (for example, \"Please remember that my favorite web framework is Svelte.\"). This call must succeed and its result must be stored as memory by the middleware.\n  2. **Session B (read)**: With the same `userId = harbor-user-${run-id}` but a **different** `sessionId = session-b-${run-id}`, send a prompt asking what the user's favorite web framework is (for example, \"Based on what you remember about me, what is my favorite web framework? Answer in one sentence.\"). The assistant response (`response.text`) must mention `Svelte`.\n- After Session B returns, write the Session B response text (the value of `response.text`) to `/workspace/answer.txt` (UTF-8, no extra wrapping or JSON encoding).\n- Both calls must run sequentially in the same process invocation (Session A first, then Session B), so the memory written by Session A is available to Session B.\n\n## Implementation Hints\n- The Alchemyst AI SDK documentation shows the wrapper pattern:\n  ```ts\n  import { generateText } from 'ai';\n  import { withAlchemyst } from '@alchemystai/aisdk';\n  const generateTextWithMemory = withAlchemyst(generateText, { apiKey: process.env.ALCHEMYST_AI_API_KEY });\n  ```\n- Pass `userId` and `sessionId` directly to the wrapped function alongside `model` and `prompt`.\n- For the OpenAI model, you can use the `@ai-sdk/openai` provider (e.g., `openai('gpt-4o-mini')`). The `OPENAI_API_KEY` environment variable is picked up automatically.\n- Make sure the second call uses a different `sessionId` than the first to demonstrate cross-session recall (same `userId`).\n- Mention Svelte explicitly and unambiguously in the Session A prompt so that the memory can be retrieved reliably.\n- Use the `run-id` from `ZEALT_RUN_ID` in both `userId` and `sessionId` so the test data is isolated per run.\n- Be sure to install dependencies (`ai`, `@ai-sdk/openai`, `@alchemystai/aisdk`) and configure TypeScript to compile/execute (e.g., via `tsx` or `ts-node`).\n\n## Acceptance Criteria\n- Project path: /home/user/myproject\n- Output file: /workspace/answer.txt\n- The program must be runnable from the project directory with a single command (for example, `npm start` or `npx tsx index.ts`).\n- The program must read `ZEALT_RUN_ID`, `ALCHEMYST_AI_API_KEY`, and `OPENAI_API_KEY` from environment variables.\n- The program must use the wrapped `generateText` (via `withAlchemyst`) for both Session A and Session B.\n- After execution:\n  - The file `/workspace/answer.txt` must exist.\n  - The file content must be the textual response from Session B (i.e., `response.text` of the second wrapped call).\n  - The content must contain the substring `svelte` (case-insensitive), demonstrating that memory from Session A was recalled in Session B.\n\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"b\":\"KkqPKlbbk8A4Bb2iiQLXO\",\"c\":[\"\",\"tasks\",\"\"],\"q\":\"\",\"i\":false,\"f\":[[[\"\",{\"children\":[\"tasks\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],[[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/alchemyst-benchmark/_next/static/chunks/77332f07450ef206.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-0\",{\"src\":\"/alchemyst-benchmark/_next/static/chunks/babff0e7418ab052.js\",\"async\":true,\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-1\",{\"src\":\"/alchemyst-benchmark/_next/static/chunks/3ecbb78a8ff87549.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"suppressHydrationWarning\":true,\"children\":[\"$\",\"body\",null,{
